<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Spotify Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class'}</script>
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>

    <!-- POOKIE, here his the colors for the page -->
    <style>
        :root{
            --bg:#f9fafb;
            --surface:#fff;
            --border:#e5e7eb;
            --text:#171717;
            --muted:#737373;
            --accent:#1DB954
        }
        .dark{
            --bg:#080c09;
            --surface:#101310;
            --border:#25302A;
            --text:#DBDBDB;
            --muted:#969C98;
            --accent:#1DB954
        }
        .theme-bg{background:var(--bg)}.theme-surface{background:var(--surface)}
        .theme-border{border-color:var(--border)}.theme-text{color:var(--text)}
        .theme-muted{color:var(--muted)}.theme-placeholder{background:var(--border)}
        .theme-accent{color:var(--accent)}.theme-hover-accent:hover{color:var(--accent)}
    </style>
</head>

<body class="theme-bg theme-text font-sans transition-colors duration-300">

<header class="theme-surface border-b theme-border transition-colors duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">

            <a href="/dashboard" class="text-sm tracking-[0.3em] uppercase theme-text theme-hover-accent transition-colors duration-500">
                Spotify Dashboard
            </a>

            <div class="hidden md:flex items-center space-x-6 uppercase text-[9px] tracking-[0.3em]">
                <a href="/dashboard" class="theme-muted theme-hover-accent transition-colors duration-500">Dashboard</a>
                <a href="/top-artists" class="theme-muted theme-hover-accent transition-colors duration-500">Top Artists</a>
                <a href="/top-tracks" class="theme-muted theme-hover-accent transition-colors duration-500">Top Tracks</a>
                <a href="/recently-played" class="theme-muted theme-hover-accent transition-colors duration-500">Recently Played</a>
                <a href="/album-search" class="theme-muted theme-hover-accent transition-colors duration-500">Rank Tracklist</a>
                <a href="/logout" class="text-red-500 hover:text-red-700 transition-colors duration-500">Logout</a>
                <button id="theme-toggle" type="button" class="theme-muted theme-hover-accent transition-colors duration-500">Dark Mode</button>
            </div>

            <button id="mobile-menu-toggle" type="button" class="md:hidden text-[9px] uppercase tracking-[0.3em] theme-muted theme-hover-accent transition-colors duration-500">
                Menu
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden border-t theme-border">
            <div class="py-4 space-y-1 uppercase text-[9px] tracking-[0.3em]">
                <a href="/dashboard" class="block py-3 theme-muted theme-hover-accent transition-colors duration-300">Dashboard</a>
                <a href="/top-artists" class="block py-3 theme-muted theme-hover-accent transition-colors duration-300">Top Artists</a>
                <a href="/top-tracks" class="block py-3 theme-muted theme-hover-accent transition-colors duration-300">Top Tracks</a>
                <a href="/recently-played" class="block py-3 theme-muted theme-hover-accent transition-colors duration-300">Recently Played</a>
                <a href="/album-search" class="block py-3 theme-muted theme-hover-accent transition-colors duration-300">Rank Tracklist</a>
                <button id="mobile-theme-toggle" type="button" class="block w-full text-left py-3 theme-muted theme-hover-accent transition-colors duration-300">Dark Mode</button>
                <a href="/logout" class="block py-3 text-red-500 hover:text-red-700 transition-colors duration-300">Logout</a>
            </div>
        </div>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="mt-12 text-center theme-muted text-xs tracking-wide uppercase transition-colors duration-300">
    <hr class="my-4 border-t theme-border">
    <p>&copy; 2025 andy & willy. All rights reserved. <a href="https://github.com/campwill/spotify-app" class="theme-accent underline">Github.</a></p>
</footer>

<script>
    const themeToggle=document.getElementById('theme-toggle'),mobileThemeToggle=document.getElementById('mobile-theme-toggle'),mobileMenuToggle=document.getElementById('mobile-menu-toggle'),mobileMenu=document.getElementById('mobile-menu');

    function updateThemeButtons(){
        const text=document.documentElement.classList.contains('dark')?'Light Mode':'Dark Mode';
        themeToggle.textContent=text;
        mobileThemeToggle.textContent=text;
    }

    updateThemeButtons();

    function toggleTheme(){
        const isDark=document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme',isDark?'dark':'light');
        updateThemeButtons();
    }

    themeToggle.addEventListener('click',toggleTheme);
    mobileThemeToggle.addEventListener('click',toggleTheme);

    mobileMenuToggle.addEventListener('click',()=>{
        mobileMenu.classList.toggle('hidden');
        mobileMenuToggle.textContent=mobileMenu.classList.contains('hidden')?'Menu':'Close';
    });
</script>

</body>
</html>
